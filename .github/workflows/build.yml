name: Build SpearSMP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode clean package
      - uses: actions/upload-artifact@v4
        with:
          name: SpearSMP-build
          path: target/SpearSMP-1.0.0.jar
